      bottom: 56px;

      width: auto;
      height: auto;
      max-height: none;

  function applyRevenueTableZoom(table){
    if(!table) return;
    var z=revenueZoom;
    table.classList.add('revenue-table-zoom');
    // Scale the COMPLETE table, not just the text. This makes the column
    // widths, cell padding, borders and row heights shrink/grow together.
    // CSS zoom is supported by Android Chromium/WebView and keeps the table
    // scrollable while allowing many more cells to fit at lower zoom.
    table.style.setProperty('--revenue-font-size','.88rem');
    table.style.fontSize='.88rem';
    table.style.lineHeight='1.25';

    table.style.transform='none';
    table.style.transformOrigin='top left';
    table.style.width='max-content';
    table.style.minWidth='1510px';
    // Let the browser keep the original column proportions. Because the
    // entire table is zoomed, every cell follows the text size automatically.

  function openIdb() {
    if (idbHandle) return idbHandle;
    idbHandle = new Promise(function(resolve, reject) {
      if (!window.indexedDB) { reject(new Error('no indexeddb')); return; }
      var req = indexedDB.open(IDB_NAME, 1);
      req.onupgradeneeded = function(e) {
        var db = e.target.result;
        if (!db.objectStoreNames.contains(IDB_STORE)) db.createObjectStore(IDB_STORE, { keyPath: 'key' });
      };
      req.onsuccess = function(e) { resolve(e.target.result); };
      req.onerror = function() { reject(req.error); };
    });
    return idbHandle;
  }
  function idbGet(key) {
    return openIdb().then(function(db) {
      return new Promise(function(resolve) {
        try {
          var tx = db.transaction(IDB_STORE, 'readonly');
          var req = tx.objectStore(IDB_STORE).get(key);
          req.onsuccess = function() { resolve(req.result ? req.result.value : null); };
          req.onerror = function() { resolve(null); };
        } catch (e) { resolve(null); }
      });
    }).catch(function() { return null; });
  }

  }

  function idbSet(key, value) {
    return openIdb().then(function(db) {
      return new Promise(function(resolve) {
        var done = false;
        function finish(ok){ if(done) return; done=true; resolve(ok); }
        try {
          var tx = db.transaction(IDB_STORE, 'readwrite');
          tx.oncomplete = function() { finish(true); };
          tx.onerror = function() { finish(false); };
          tx.onabort = function() { finish(false); };
          tx.objectStore(IDB_STORE).put({ key: key, value: value });
        } catch (e) { finish(false); }
      });
    }).catch(function() { return false; });
  }
  function requestPersistentStorage(){

  function compactSource(src) {
    return { headers: src.headers, fileName: src.fileName, updatedAt: src.updatedAt, data: src.rows.map(function(r) { return src.headers.map(function(h) { return r[h]; }); }) };

  function expandSource(compact) {
    if (!compact || !compact.headers || !compact.headers.length) return EMPTY_SRC();
    var rows = (compact.data || []).map(function(arr) {
      var o = {};
      compact.headers.forEach(function(h, i) { o[h] = arr[i]; });
      return o;
    });
    return { headers: compact.headers, rows: rows, fieldMap: buildFieldMap(compact.headers), fileName: compact.fileName, updatedAt: compact.updatedAt };
  }

  function loadAllAsync() {

    return Promise.all(reads).then(function(results) {
      SOURCE_DEFS.forEach(function(sd, i) { sources[sd.id] = expandSource(results[i]); });

      if (!s) {

      if (!settings.substations || !settings.substations.length) settings.substations = DEFAULT_SUBSTATIONS.slice();
      if (typeof settings.activeSubstation !== 'string') settings.activeSubstation = 'BISNAULI_141024';
      if (typeof settings.fieldName !== 'string') settings.fieldName = '33/11KV S/S BISNAULI';
      if (typeof settings.filterBySubstation !== 'boolean') settings.filterBySubstation = true;

  function mergeById(localArr, remoteArr) {
    var map = {};
    localArr.forEach(function(x) { map[x.id || genId('local')] = x; });

    var out = Object.keys(map).map(function(k) { return map[k]; });

  function decompressGzip(buffer) {
    // Android WebView compatibility: older WebViews do not provide
    // DecompressionStream. Use pako when available, then fall back to the
    // native API on newer browsers.
    if (window.pako && typeof window.pako.ungzip === 'function') {
      try {
        var out = window.pako.ungzip(new Uint8Array(buffer));
        return Promise.resolve(out.buffer.slice(out.byteOffset, out.byteOffset + out.byteLength));
      } catch (e) {
        console.warn('PAKO GZIP FAILED:', e);
      }
    }
    if (window.DecompressionStream) {
      try {
        var stream = new Blob([buffer]).stream().pipeThrough(new DecompressionStream('gzip'));
        return new Response(stream).arrayBuffer();
      } catch (e) {
        return Promise.reject(e);
      }
    }
    return Promise.reject(new Error('GZIP_NOT_SUPPORTED_IN_THIS_WEBVIEW'));
  }

  function downloadRemoteSource(sourceId, path, token) {
    return fetchWithTimeout(DATA_GATEWAY_URL, {
      method: 'POST',
      headers: {
        'Authorization': 'Bearer ' + token,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({ files: [path] })
    }, 20000).then(function(r) {
      return r.text().then(function(txt) {
        var d = null;
        try { d = JSON.parse(txt); } catch(e) {}
        if (!r.ok) throw new Error('GATEWAY_HTTP_' + r.status + (d && d.error ? ': ' + d.error : ''));
        if (!d || !d.success) throw new Error('GATEWAY_ERROR' + (d && d.error ? ': ' + d.error : ''));
        if (!d.files || !d.files.length || !d.files[0].url) throw new Error('SIGNED_URL_NOT_AVAILABLE');

        if (!r.ok) throw new Error('REMOTE_DOWNLOAD_FAILED_' + r.status);

    }).then(function(gz) {
      return decompressGzip(gz);
    }).then(function(raw) {
      var parsed = parseWorkbook(new Uint8Array(raw));
      if (!parsed.rows.length) throw new Error('REMOTE_FILE_EMPTY');
      var old = sources[sourceId];
      sources[sourceId] = {
        headers: parsed.headers,
        rows: parsed.rows,
        fieldMap: buildFieldMap(parsed.headers),
        fileName: (old && old.fileName && old.fileName !== 'latest.csv.gz') ? old.fileName : path.split('/').pop(),
        updatedAt: new Date().toISOString()

      });

      return idbSet(sd.lsKey, compactSource(sources[sourceId])).then(function(ok) {

        return { id: sourceId, rows: parsed.rows.length };
      });
    });
  }

  function syncRemoteSourcesV26(ids, statusKey) {
    if (remoteDataSyncBusy || !firebaseReady || !navigator.onLine) return Promise.resolve(false);
    remoteDataSyncBusy = true;
    var results = [];

    function runOne(index, token) {
      if (index >= ids.length) return Promise.resolve();
      var id = ids[index];
      return downloadRemoteSource(id, REMOTE_DATA_PATH[id], token)
        .then(function(r) {
          results.push({id:id, ok:true, rows:r.rows});
          setSourceLastSyncV30(id, Date.now());

        .catch(function(e) {

        .then(function() {

          return runOne(index + 1, token);

      .then(function(token) { return runOne(0, token); });

      .then(function(v){ if(v === '__SYNC_TIMEOUT__') throw new Error('MASTER/REMOTE SYNC TIMEOUT (70s)'); return v; })
      .then(function() {
        remoteDataLastSync = Date.now();
        rebuildMerged();
        render();
        var failed = results.filter(function(x){ return !x.ok; });
        try {
          localStorage.setItem(statusKey || 'UPPCL_LAST_REMOTE_SYNC_STATUS_V26', JSON.stringify({
            time: new Date().toISOString(), results: results
          }));
        } catch(e) {}
        if (failed.length) console.warn('ONLINE DATA SYNC PARTIAL:', results);
        else console.log('ONLINE DATA SYNC COMPLETE:', results);
        return failed.length === 0;
      })
      .catch(function(e) {
        var msg = (e && e.message) ? e.message : String(e);
        console.warn('ONLINE DATA SYNC FATAL:', msg);
        try {
          localStorage.setItem(statusKey || 'UPPCL_LAST_REMOTE_SYNC_STATUS_V26', JSON.stringify({
            time: new Date().toISOString(), fatal: msg, results: results
          }));
        } catch(_) {}
        return false;
      })
      .then(function(ok) {
        remoteDataSyncBusy = false;
        return ok;
      }, function(e) {
        remoteDataSyncBusy = false;
        throw e;
      });
  }

  function formatRevenueLastPayDate(value) {
    var s = String(value == null ? '' : value).trim();
    if (!s || /^(NAA|NA|NULL|NONE|-)$/i.test(s)) return s;

    var months = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
    var m, day = 0, mon = 0, year = 0;

    // YYYY-MM-DD / YYYY/MM/DD
    m = s.match(/^(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})/);
    if (m) {
      year = +m[1]; mon = +m[2]; day = +m[3];
    } else {
      // DD-MMM-YYYY / DD-MMM-YY
      m = s.match(/^(\d{1,2})[-\/]([A-Za-z]{3,9})[-\/](\d{2,4})/);
      if (m) {
        day = +m[1];
        mon = months.indexOf(String(m[2]).slice(0,3).toUpperCase()) + 1;
        year = +m[3];
      } else {
        // Numeric date from the UPPCL/Excel report. The report uses MM/DD/YY
        // (e.g. 9/22/26 = 22-Sep-26). If the pattern is unambiguous
        // (one side > 12), handle DD/MM as well.
        m = s.match(/^(\d{1,2})[-\/](\d{1,2})[-\/](\d{2,4})/);
        if (m) {
          var p1=+m[1], p2=+m[2];
          if (p1 > 12 && p2 <= 12) { day=p1; mon=p2; }
          else { mon=p1; day=p2; }
          year=+m[3];
        }
      }
    }

    if (year > 0 && year < 100) year += 2000;

    if (day >= 1 && day <= 31 && mon >= 1 && mon <= 12 && year >= 1900) {
      return String(day).padStart(2,'0') + '-' + months[mon-1] + '-' + String(year).slice(-2);
    }

    return s;
  }

          if (digits.length === 11 && digits.charAt(0) === '0') digits = digits.slice(1);
          if (digits.length > 10) digits = digits.slice(-10);
          if (digits.length === 10) {
            try {
              doc.link(data.cell.x, data.cell.y, data.cell.width, data.cell.height, {
                url: 'tel:+91' + digits
              });
            } catch (e) { console.warn('MOBILE PDF LINK FAILED:', e); }
          }
          return;
        }

        // LAT LONG -> Google Maps
        if (data.column.index === latLongColumnIndex) {
          var rawLatLong = data.cell && data.cell.raw != null ? String(data.cell.raw).trim() : '';
          var match = rawLatLong.match(/(-?\d+(?:\.\d+)?)\s*,\s*(-?\d+(?:\.\d+)?)/);
          if (!match) return;
          var lat = parseFloat(match[1]);
          var lon = parseFloat(match[2]);
          if (!isFinite(lat) || !isFinite(lon) || lat < -90 || lat > 90 || lon < -180 || lon > 180) return;
          var mapUrl = 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(lat.toFixed(6) + ',' + lon.toFixed(6));
          try {

              url: mapUrl
            });
          } catch (e) { console.warn('LAT LONG PDF MAP LINK FAILED:', e); }
        }
      }
    };
  }

  function saveDataUrlNative(dataUrl, filename, mimeType){
    try {
      if (window.Android && typeof window.Android.startBase64File === 'function' &&
          typeof window.Android.appendBase64File === 'function' &&
          typeof window.Android.finishBase64File === 'function') {
        var base64 = String(dataUrl || '').split(',')[1] || '';
        if (!base64) return false;
        var chunkSize = 180000;
        window.Android.startBase64File(filename, mimeType);
        for (var i = 0; i < base64.length; i += chunkSize) {
          window.Android.appendBase64File(base64.substring(i, i + chunkSize));
        }
        window.Android.finishBase64File();
        return true;
      }
      if (window.Android && typeof window.Android.saveBase64File === 'function') {
        var b64 = String(dataUrl || '').split(',')[1] || '';
        if (!b64) return false;
        window.Android.saveBase64File(filename, mimeType, b64);
        return true;
      }
    } catch(e) {
      console.error('NATIVE FILE SAVE FAILED:', e);
      try { alert('NATIVE DOWNLOAD FAILED: ' + (e.message || e)); } catch(ignore) {}
    }
    return false;
  }

  function formatHistoryDateEnglish(value) {
    if (value === null || value === undefined || value === '') return '';
    var raw = String(value).trim();
    var d = new Date(raw);
    if (isNaN(d.getTime())) {
      var m = raw.match(/(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})/);
      if (m) {
        var yy = parseInt(m[3],10); if (yy < 100) yy += 2000;
        var mm = parseInt(m[2],10) - 1;
        d = new Date(yy, mm, parseInt(m[1],10));
      }
    }
    if (isNaN(d.getTime())) return raw;
    var months = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
    var day = String(d.getDate()).padStart(2,'0');
    var mon = months[d.getMonth()];
    var year = d.getFullYear();
    var hh = d.getHours(), mi = d.getMinutes();
    var time = (hh || mi) ? ' ' + String(hh).padStart(2,'0') + ':' + String(mi).padStart(2,'0') : '';
    return day + ' ' + mon + ' ' + year + time;
  }

  async function readDirectoryRecursive(dir, found) {
    for await (var pair of dir.entries()) {
      var name=pair[0], handle=pair[1];
      if(handle.kind==='file' && /\.(csv|csv\.gz|gz|xlsx|xls)$/i.test(name)) {
        found.push({name:name,handle:handle});
      } else if(handle.kind==='directory') {
        await readDirectoryRecursive(handle,found);
      }
    }
  }
  async function syncDataFolder() {
    if(!window.showDirectoryPicker){ alert('DATA FOLDER AUTO SYNC IS SUPPORTED IN CHROME/EDGE. PLEASE USE THE NORMAL UPDATE BUTTONS IN OTHER BROWSERS.'); return; }
    try{
      var dir=await window.showDirectoryPicker({mode:'read'}), files=[];
      await readDirectoryRecursive(dir,files);
      var matched={billed:null,unbilled:null,master:null};
      for (const x of files) {
        var n=x.name.toUpperCase();
        var id = (n.indexOf('UNBILLED')>=0) ? 'unbilled'
               : (n.indexOf('BILLED')>=0) ? 'billed'
               : ((n.indexOf('MASTER')>=0 || n.indexOf('PVVNL_DIV')>=0) ? 'master' : null);
        if (!id) continue;
        var f = await x.handle.getFile();
        if (!matched[id] || f.lastModified > matched[id].lastModified) {
          matched[id] = { name:x.name, handle:x.handle, lastModified:f.lastModified };
        }
      }
      for(const id of ['billed','unbilled','master']){
        if(matched[id]){ var f=await matched[id].handle.getFile(); await handleFile(id,f); }
      }
      alert('DATA FOLDER SYNC COMPLETE.');
    }catch(e){ if(e.name!=='AbortError') alert('FOLDER SYNC FAILED: '+e.message); }
  }

  }
  function exportPdf() {
    try {
      if (!window.jspdf || !window.jspdf.jsPDF) {
        alert('PDF LIBRARY LOAD NAHI HUI. INTERNET ON KARKE APP REOPEN KAREIN.');
        return;
      }
      if (!collections.length && !inspections.length) { alert('NO DATA RECORDED YET.'); return; }
    var doc = new window.jspdf.jsPDF({ orientation: 'landscape' });
    var y = 12;
    doc.setFontSize(13); doc.text('REPORT - PASHCHIMANCHAL VIDYUT VITRAN NIGAM', 14, y); y += 6;
    if (collections.length) {
      doc.setFontSize(11); doc.text('COLLECTIONS', 14, y); y += 2;
      doc.autoTable({
        startY: y,
        head: [['ACCOUNT NO', 'METER NO', 'MOBILE', 'NAME', 'FATHER/HUSBAND NAME', 'ADDRESS', 'BILL AMT', 'PAID', 'REMAINING', 'PROMISED DATE', 'REMARKS', 'DATE']],
        body: collections.map(function(c) { return [c.connection||'', c.meter||'', c.mobile||'', c.name||'', c.fatherName||'', c.address||'', c.due, c.paid, c.remaining, c.promised||'', c.remarks||'', c.date]; }),
        didDrawCell:addMobilePdfLinks(doc, 2).didDrawCell,
        styles: { fontSize: 7 },
        headStyles: { fillColor: [15, 110, 92] }
      });
      y = doc.lastAutoTable.finalY + 10;
    }
    if (inspections.length) {
      if (y > 180) { doc.addPage('landscape'); y = 15; }
      doc.setFontSize(11); doc.text('INSPECTIONS', 14, y); y += 2;
      doc.autoTable({
        startY: y,
        head: [['NAME', 'METER NO', 'READING', 'LOAD (KW)', 'THEFT STATUS', 'THEFT TYPE', 'METER LOCATION', 'DATE']],
        body: inspections.map(function(i) { return [i.name||'', i.meter||'', i.reading||'', i.load||'', i.theftStatus||'', i.theftType||'', i.meterLoc||'', i.date]; }),
        styles: { fontSize: 7 },
        headStyles: { fillColor: [15, 110, 92] }
      });
    }
      var filename = 'REPORT_' + Date.now() + '.pdf';
      var dataUrl = doc.output('datauristring');
      if (!saveDataUrlNative(dataUrl, filename, 'application/pdf')) {
        doc.save(filename);
      }
    } catch(e) {
      console.error('PDF EXPORT FAILED:', e);
      alert('PDF DOWNLOAD FAILED: ' + ((e && e.message) || 'UNKNOWN ERROR') + '\n\nANDROID APP ME DOWNLOAD KE LIYE WEBVIEW DOWNLOAD SUPPORT BHI REQUIRED HAI.');
    }
  }

  function wireEvents() {
    document.querySelectorAll('.upload-btn').forEach(function(btn) {
      btn.onclick = function() { document.getElementById('fileInput_' + btn.getAttribute('data-src')).click(); };
    });
    var remoteNow = document.getElementById('btnRemoteSyncNow');
    if(remoteNow) remoteNow.onclick = function(){
      if(!navigator.onLine){ alert('INTERNET CONNECTION REQUIRED.'); return; }
      remoteNow.disabled = true; remoteNow.textContent = 'UPDATING...';
      syncDailyFieldDataV26().then(function(ok){
        remoteNow.disabled = false; remoteNow.textContent = 'UPDATE BILLED + UNBILLED';
        if(ok){ showSyncToast('✅ BILLED + UNBILLED UPDATED — ' + fmtDateTime(new Date())); render(); }
        else {
          var st = null; try { st = JSON.parse(localStorage.getItem('UPPCL_LAST_DAILY_SYNC_STATUS_V26') || 'null'); } catch(e) {}
          var msg = (st && st.results) ? st.results.map(function(x){ return x.id.toUpperCase()+': '+(x.ok?'OK':x.error); }).join('\\n') : ((st && st.fatal) ? 'FATAL: '+st.fatal : 'UNKNOWN SYNC ERROR');
          alert('DAILY SERVER SYNC FAILED/PARTIAL.\\n\\n' + msg);
        }
      });
    };

    var masterNow = document.getElementById('btnMasterSyncNow');
    if(masterNow) masterNow.onclick = function(){
      if(!navigator.onLine){ alert('INTERNET CONNECTION REQUIRED.'); return; }
      if(remoteDataSyncBusy){ alert('ANOTHER DATA UPDATE IS ALREADY RUNNING. PLEASE WAIT.'); return; }
      if(!confirm('MASTER DATA monthly update karna hai?')) return;
      masterNow.disabled = true; masterNow.textContent = 'UPDATING MASTER...';
      syncMasterDataV26().then(function(ok){
        masterNow.disabled = false; masterNow.textContent = 'UPDATE MASTER DATA';
        if(ok){ showSyncToast('✅ MASTER DATA UPDATED — ' + fmtDateTime(new Date())); render(); }
        else {
          var st = null; try { st = JSON.parse(localStorage.getItem('UPPCL_LAST_MASTER_SYNC_STATUS_V26') || 'null'); } catch(e) {}
          var msg = (st && st.results) ? st.results.map(function(x){ return x.id.toUpperCase()+': '+(x.ok?'OK':x.error); }).join('\n') : ((st && st.fatal) ? 'FATAL: '+st.fatal : 'MASTER UPDATE TIMED OUT / FAILED');
          alert('MASTER UPDATE FAILED.\n\n' + msg);
        }
      }).catch(function(e){
        masterNow.disabled = false; masterNow.textContent = 'UPDATE MASTER DATA';
        alert('MASTER UPDATE FAILED: ' + ((e && e.message) || 'UNKNOWN ERROR'));
      });
    };
    document.querySelectorAll('.fileInput').forEach(function(inp) {
      inp.onchange = function(e) { if (e.target.files && e.target.files[0]) handleFile(inp.getAttribute('data-src'), e.target.files[0]); };
    });

    var manualUploadToggle = document.getElementById('btnManualUploadToggle');
    if (manualUploadToggle) manualUploadToggle.onclick = function(e) {
      if (e) e.preventDefault();
      var panel = document.getElementById('manualUploadPanel');
      if (!panel) return;
      var isHidden = window.getComputedStyle(panel).display === 'none';
      panel.style.display = isHidden ? 'block' : 'none';
      manualUploadPanelOpen = isHidden;
      manualUploadToggle.textContent = isHidden ? 'HIDE MANUAL CSV UPLOAD' : 'UPLOAD MANUALLY CSV FILES';
    };

    var revenueFilterToggle = document.getElementById('btnRevenueFilterToggle');
    if (revenueFilterToggle) revenueFilterToggle.onclick = function(e) {
      if (e) e.preventDefault();
      var panel = document.getElementById('revenueFilterPanel');
      if (!panel) return;
      var isHidden = window.getComputedStyle(panel).display === 'none';
      panel.style.display = isHidden ? 'block' : 'none';
      revenueFilterPanelOpen = isHidden;
      revenueFilterToggle.textContent = isHidden ? 'HIDE REVENUE LIST FILTER' : 'SHOW REVENUE LIST FILTER';
    };

    var gear = document.getElementById('btnSettings');
    if (gear) gear.onclick = function() { view.mode = 'settings'; render(); };
    var ql1 = document.getElementById('qlReports'); if (ql1) ql1.onclick = function() { view.mode = 'reports'; render(); };
    var ql2 = document.getElementById('qlSettings'); if (ql2) ql2.onclick = function() { view.mode = 'settings'; render(); };

    var headSearch = document.getElementById('headSearch');
    if (headSearch) headSearch.onclick = function() { document.getElementById('accSearch').classList.toggle('open'); };
    var headBill = document.getElementById('headBill');
    if (headBill) headBill.onclick = function() { document.getElementById('accBill').classList.toggle('open'); };
    var headInsp = document.getElementById('headInsp');
    if (headInsp) headInsp.onclick = function() { document.getElementById('accInsp').classList.toggle('open'); };
    document.querySelectorAll('.consumer-search-mode').forEach(function(btn){ btn.onclick=function(){
      var mode=btn.getAttribute('data-search-mode'); view.searchType=mode; view.query=''; view.priorityResults=null; view.prioritySource=''; view.searchFloatSuppressed=false;
      if(mode==='name'){ view.nameBookFilterOpen=true; render(); return; }
      view.nameBookFilterOpen=false; view.nameBookNos=[]; render(); setTimeout(function(){var si=document.getElementById('searchInput');if(si)si.focus();},30);
    }; });

    var nameBookModal=document.getElementById('nameBookModal');
    var closeNameBookModal=document.getElementById('closeNameBookModal');
    var cancelNameBookModal=document.getElementById('cancelNameBookModal');
    var applyNameBookModal=document.getElementById('applyNameBookModal');
    var selectAllNameBooks=document.getElementById('selectAllNameBooks');
    var deselectAllNameBooks=document.getElementById('deselectAllNameBooks');
    function closeNameBookPicker(){ view.nameBookFilterOpen=false; render(); setTimeout(function(){var si=document.getElementById('searchInput');if(si)si.focus();},30); }
    if(closeNameBookModal) closeNameBookModal.onclick=closeNameBookPicker;
    if(cancelNameBookModal) cancelNameBookModal.onclick=closeNameBookPicker;
    if(selectAllNameBooks) selectAllNameBooks.onclick=function(){
      document.querySelectorAll('.name-book-check').forEach(function(c){ c.checked=true; });
    };
    if(deselectAllNameBooks) deselectAllNameBooks.onclick=function(){
      document.querySelectorAll('.name-book-check').forEach(function(c){ c.checked=false; });
    };
    if(applyNameBookModal) applyNameBookModal.onclick=function(){
      var chosen=[]; document.querySelectorAll('.name-book-check:checked').forEach(function(c){chosen.push(String(c.value));});
      if(!chosen.length){alert('PLEASE SELECT AT LEAST ONE BOOK NO.');return;}
      view.nameBookNos=chosen; view.nameBookFilterOpen=false; view.query=''; view.mode='search'; view.priorityResults=null; view.prioritySource=''; view.searchFloatSuppressed=false; render();
      setTimeout(function(){var si=document.getElementById('searchInput');if(si)si.focus();},30);
    };
    if(nameBookModal) nameBookModal.onclick=function(e){if(e.target===nameBookModal)closeNameBookPicker();};
    var searchInput = document.getElementById('searchInput');
    if (searchInput) {
      searchInput.oninput = function(e) {
        var nq=e.target.value, ss=e.target.selectionStart, se=e.target.selectionEnd;
        if(nq!==view.query)view.unbilledPromptedFor='';
        view.query=nq; view.mode='search'; view.searchFloatSuppressed=false; view.priorityResults=null; view.prioritySource='';
        if(searchDebounceTimer)clearTimeout(searchDebounceTimer);
        searchDebounceTimer=setTimeout(function(){
          runPrioritySearch();
          updateMainSearchResults();
          var el=document.getElementById('searchInput');
          if(el && document.activeElement!==el){el.focus();}
          if(el){try{el.setSelectionRange(Math.min(ss,el.value.length),Math.min(se,el.value.length));}catch(_e){}}
        },140);
      };
      searchInput.onpaste = function(){ setTimeout(function(){ var el=document.getElementById('searchInput'); if(el){ view.unbilledPromptedFor=''; view.query=el.value; view.mode='search'; view.searchFloatSuppressed=false; view.priorityResults=null; view.prioritySource=''; runPrioritySearch(); render(); } },0); };
    }
    var repeatSearchBtn=document.getElementById('repeatSearchBtn');
    if(repeatSearchBtn) repeatSearchBtn.onclick=function(e){
      if(e)e.preventDefault();
      var el=document.getElementById('searchInput');
      var q=el ? String(el.value||'').trim() : String(view.query||'').trim();
      if(q.length<3) return;
      view.query=q;
      view.mode='search';
      view.searchFloatSuppressed=false;
      view.priorityResults=null;
      view.prioritySource='';
      view.unbilledPromptedFor='';
      runPrioritySearch();
      updateMainSearchResults();
    };

    var clearSearchBtn=document.getElementById('clearSearchBtn');
    if(clearSearchBtn) clearSearchBtn.onclick=function(){view.query='';view.mode='home';view.priorityResults=null;view.prioritySource='';view.unbilledPromptedFor='';view.searchFloatSuppressed=false;render();setTimeout(function(){var el=document.getElementById('searchInput');if(el)el.focus();},0);};
    var applyRevenueBtn=document.getElementById('applyRevenueBtn'); if(applyRevenueBtn)applyRevenueBtn.onclick=applyRevenueFilters;
    var clearRevenueBtn=document.getElementById('clearRevenueBtn'); if(clearRevenueBtn)clearRevenueBtn.onclick=clearRevenueFilters;
    document.querySelectorAll('.rev-source').forEach(function(x){x.onchange=function(){setRevenueSource(x);}});
    function updateTariffToggleButton(){
      var btn=document.getElementById('btnDeselectAllTariffs');
      if(!btn) return;
      var boxes=[].slice.call(document.querySelectorAll('.rev-tariff'));
      var allSelected=boxes.length>0 && boxes.every(function(x){return x.checked;});
      btn.textContent=allSelected?'DESELECT ALL':'SELECT ALL';
    }
    document.querySelectorAll('.rev-tariff,.rev-load').forEach(function(x){
      x.onchange=function(){
        if(x.classList.contains('rev-tariff')) updateTariffToggleButton();
      };
    });
    var deselectAllTariffs=document.getElementById('btnDeselectAllTariffs');
    if(deselectAllTariffs)deselectAllTariffs.onclick=function(){
      var boxes=[].slice.call(document.querySelectorAll('.rev-tariff'));
      var allSelected=boxes.length>0 && boxes.every(function(x){return x.checked;});
      boxes.forEach(function(x){x.checked=!allSelected;});
      updateTariffToggleButton();
    };
    updateTariffToggleButton();
    var ra=document.getElementById('revAmt'),rl=document.getElementById('revLastPay'); if(ra)ra.onchange=function(){}; if(rl)rl.onchange=function(){};
    wireFloatingSearchResults(document.getElementById('mainSearchResults'));
    var backBtn = document.getElementById('btnBack');
    if (backBtn) backBtn.onclick = function() {
      view.mode = 'home';
      view.selected = null;
      view.priorityResults = null;
      view.prioritySource = '';
      view.unbilledPromptedFor = '';
      view.searchFloatSuppressed = true;
      var floatBox = document.getElementById('mainSearchResults');
      if (floatBox) { floatBox.innerHTML = ''; floatBox.style.display = 'none'; }
      render();
    };

    // theft type toggle
    var theftSel = document.getElementById('theftStatus');
    if (theftSel) theftSel.onchange = function() {
      document.getElementById('theftTypeWrap').style.display = (theftSel.value === 'NO THEFT') ? 'none' : 'block';
    };

    // unified detail-page save: bill + inspection, whichever has values
    var btnTopSaveDetail = document.getElementById('btnTopSave');
    if (btnTopSaveDetail && view.mode === 'detail') {
      btnTopSaveDetail.onclick = function() {
        var entry = view.selected;
        var savedSomething = false;
        var paidEl = document.getElementById('billPaid');
        var promisedEl = document.getElementById('billPromised');
        var remarksEl = document.getElementById('billRemarks');
        var hasPaid = paidEl && parseFloat(paidEl.value);
        var hasNote = (promisedEl && promisedEl.value.trim()) || (remarksEl && remarksEl.value.trim());
        if (paidEl && (hasPaid || hasNote)) {
          var due = parseFloat(document.getElementById('billDue').value) || 0;
          var paid = parseFloat(paidEl.value) || 0;
          var remaining = Math.max(due - paid, 0);
          collections.push({ id: genId('c'), key: entry.key, name: mget(entry,'name'), meter: mget(entry,'meter'), connection: mget(entry,'connection'), mobile: mget(entry,'mobile'), fatherName: mget(entry,'fatherName'), address: mget(entry,'address'), due: due, paid: paid, remaining: remaining, promised: (document.getElementById('billPromised')||{}).value || '', remarks: (document.getElementById('billRemarks')||{}).value || '', date: fmtDateTime(new Date()) });
          idbSet(LS.collections, collections).then(function(ok) { if (!ok) warnStorage(); });
          savedSomething = true;
        }
        var readingEl = document.getElementById('curReading');
        var loadEl = document.getElementById('curLoad');
        if (readingEl && (readingEl.value.trim() || loadEl.value.trim())) {
          var status = document.getElementById('theftStatus').value;
          inspections.push({
            id: genId('i'), key: entry.key, name: mget(entry,'name'), meter: mget(entry,'meter'),
            reading: readingEl.value, load: loadEl.value,
            theftStatus: status, theftType: status === 'NO THEFT' ? '' : document.getElementById('theftType').value,
            meterLoc: document.getElementById('meterLoc').value, date: fmtDateTime(new Date())
          });
          idbSet(LS.inspections, inspections).then(function(ok) { if (!ok) warnStorage(); });
          savedSomething = true;
        }
        if (savedSomething) pushToDb();
        alert(savedSomething ? 'SAVED.' : 'NOTHING TO SAVE — FILL IN COLLECTION OR INSPECTION DETAILS FIRST.');
        if (savedSomething) render();
      };
    }
    // DHOOM BIJLIGHAR master/child toggle behavior.
    // Master ON => all four DHOOM filters ON. Master OFF => all four OFF.
    // Any manual child change keeps the master ON while at least one child is
    // ON, and turns it OFF only when all children are OFF.
    var dhoomMaster = document.getElementById('dhoomBijliGharMaster');
    var dhoomChildren = Array.from(document.querySelectorAll('.dhoomBijliGharFilter'));
    function syncDhoomMaster(){
      if (!dhoomMaster || !dhoomChildren.length) return;
      dhoomMaster.checked = dhoomChildren.some(function(el){ return el.checked; });
    }
    if (dhoomMaster) {
      dhoomMaster.onchange = function(){
        dhoomChildren.forEach(function(el){ el.checked = dhoomMaster.checked; });
      };
    }
    dhoomChildren.forEach(function(el){ el.onchange = syncDhoomMaster; });
    syncDhoomMaster();

    // CHITHERA BIJLIGHAR master/child toggle behavior — same as DHOOM.
    var chitheraMaster = document.getElementById('chitheraBijliGharMaster');
    var chitheraChildren = Array.from(document.querySelectorAll('.chitheraBijliGharFilter'));
    function syncChitheraMaster(){
      if (!chitheraMaster || !chitheraChildren.length) return;
      chitheraMaster.checked = chitheraChildren.some(function(el){ return el.checked; });
    }
    if (chitheraMaster) {
      chitheraMaster.onchange = function(){
        chitheraChildren.forEach(function(el){ el.checked = chitheraMaster.checked; });
      };
    }
    chitheraChildren.forEach(function(el){ el.onchange = syncChitheraMaster; });
    syncChitheraMaster();

    // unified settings-page save
    var btnTopSaveSettings = document.getElementById('btnTopSave');
    if (btnTopSaveSettings && view.mode === 'settings') {
      btnTopSaveSettings.onclick = function() {
        settings.pin = document.getElementById('setPin').value.trim();
        var filterSubEl = document.getElementById('setFilterBySubstation');
        // Save the normal filters + DHOOM children + CHITHERA children.
        // Master switches are UI controls only; the actual child filter values
        // are what must be persisted and used by the data filter.
        settings.substationFilters = Array.from(document.querySelectorAll('.bijliGharFilter:checked, .dhoomBijliGharFilter:checked, .chitheraBijliGharFilter:checked')).map(function(x){ return x.value; });
        settings.activeSubstation = settings.substationFilters[0] || 'BISNAULI_141024';
        settings.fieldName = '33/11KV S/S BISNAULI';
        settings.filterBySubstation = !!(filterSubEl && filterSubEl.checked);
        view.substation = settings.filterBySubstation ? settings.activeSubstation : '';
        // V58: Substation rename list removed; keep existing settings data untouched.
        if (!settings.visibleFields) settings.visibleFields = {};
        document.querySelectorAll('.fieldToggle').forEach(function(el) { settings.visibleFields[el.getAttribute('data-h')] = el.checked; });
        settings.updatedAt = new Date().toISOString();

        // Save immediately to localStorage as a WebView-safe fallback.
        try {
          localStorage.setItem('UPPCL_SETTINGS_V55', JSON.stringify(settings));
        } catch(e) {
          console.warn('SETTINGS LOCALSTORAGE SAVE FAILED:', e);
        }

        // Persist to IndexedDB before leaving the settings screen.
        idbSet(LS.settings, settings).then(function(ok) {
          if (!ok) warnStorage();
          pushSettingsToDb();
          alert('SETTINGS SAVED.');
          render();
        }).catch(function() {
          pushSettingsToDb();
          alert('SETTINGS SAVED TO DEVICE.');
          render();
        });
      };
    }

    var btnExportExcel = document.getElementById('btnExportExcel');
    if (btnExportExcel) btnExportExcel.onclick = exportExcel;
    var btnExportPdf = document.getElementById('btnExportPdf');
    if (btnExportPdf) btnExportPdf.onclick = exportPdf;
    var btnFirebaseLogout = document.getElementById('btnFirebaseLogout');
    if (btnFirebaseLogout) btnFirebaseLogout.onclick = logoutFirebase;
  }

  document.addEventListener('keydown', function(e) {
    if (e.key === 'F12') e.preventDefault();
    if (e.ctrlKey && e.shiftKey && ['I','J','C'].indexOf(e.key.toUpperCase()) !== -1) e.preventDefault();
    if (e.ctrlKey && e.key.toUpperCase() === 'U') e.preventDefault();
  });

  // Ask supported browsers to keep the local IndexedDB cache across sessions.
  // This is especially important for the large Master dataset.
  requestPersistentStorage();

  // BOOT: show/login-gate immediately. Never make the login screen wait for
  // large IndexedDB datasets (especially the Master CSV on mobile).
  document.getElementById('app').innerHTML = '<div class="firebase-login-wrap"><div class="firebase-login-card"><h2>UPPCL FIELD APP</h2><p>SECURE LOGIN CHECK…</p></div></div>';

  // Mobile SDK-load safety guard. If the external Firebase scripts are blocked,
  // never leave the user on the boot screen forever.
  setTimeout(function(){
    if (firebaseConfigReady() && !firebaseAuthReady) {
      if (typeof firebase === 'undefined') {
        firebaseAuthReady=true;
        showFirebaseLogin('FIREBASE SDK LOAD NAHI HUA. INTERNET CHECK KAREIN AUR RELOAD KAREIN.');
      }
    }
  }, 7000);

  // Load local/offline data in the background. This can take time on mobile,
  // but it must never block the login screen.
  loadAllAsync().then(function() {
    resetRemarkCycleIfNeeded(false);
    initDb();
    startRemarkAutoSync();
    // Always render local IndexedDB cache as soon as it is loaded.
    // Network/auth state must never erase the cached datasets.
    render();

  }).catch(function(){
    if(firebaseUser) render();
  });

  if (firebaseConfigReady()) {
    initFirebaseV7().then(function(){
      // V55: periodic Firebase sync disabled.
      startRemoteDataAutoSyncV20();
      if (firebaseUser) {
        // IMPORTANT: render the locally cached data FIRST. Network sync must
        // never blank the screen or make the user wait for a large CSV.
        render();
        // Auto-sync is already started by initFirebaseV7/startRemoteDataAutoSyncV20. Keep boot non-blocking.

      }
    });
  } else {
    firebaseAuthReady=true;
    showFirebaseLogin('FIREBASE CONFIG MISSING.');
  }
})();

  window.addEventListener('pagehide', function(){ try{ saveRevenueUiState(); saveRevenueFilterState(); }catch(e){} });
  document.addEventListener('visibilitychange', function(){ if(document.visibilityState==='hidden'){ try{ saveRevenueUiState(); saveRevenueFilterState(); }catch(e){} } });
</script>
